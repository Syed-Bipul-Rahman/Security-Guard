[package]
name = "guard"
# Keep in step with guard.py VERSION (tests/test_rust_binary.py checks it).
# Release builds override it with GUARD_VERSION at compile time.
version = "2.0.0"
edition = "2021"
description = "Guard as one static binary: the Rust port of guard.py (step 4 of the Rust migration)"
license = "MIT"
publish = false

[[bin]]
name = "guard"
path = "src/main.rs"

[dependencies]
# The scan engine: JSON rule matching, YARA (yara-x), content heuristics.
guard_core = { path = "../core", default-features = false }
bzip2 = "0.6"
getrandom = "0.3"
lzma-rust2 = { version = "0.16", default-features = false, features = ["std", "xz"] }
md-5 = "0.11"
sha1 = "0.11"
tar = { version = "0.4", default-features = false }
zip = { version = "8", default-features = false, features = ["deflate-flate2", "bzip2", "lzma"] }
base64 = "0.23.1"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
flate2 = "1"
gethostname = "1"
mac_address = "1"
regex = "1"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
# rustls + bundled Mozilla roots: HTTPS works in a static binary with no system
# CA store, the job certifi did for the PyInstaller build.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Wdk_System_SystemServices", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
flate2 = "1"
