[package]
name = "guard_core"
version = "2.1.0"
edition = "2021"
description = "Native (Rust) acceleration for Guard's antivirus engine: rule matching and content heuristics"
license = "MIT"
publish = false

[lib]
name = "guard_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
memchr = "2.8.3"
pyo3 = { version = "0.29.3", features = ["abi3-py310"] }
regex = "1.13.1"
serde_json = { version = "1.0.151", features = ["preserve_order"] }

[features]
# maturin turns this on for the Python extension build; `cargo test` leaves it off
extension-module = ["pyo3/extension-module"]

[profile.release]
lto = true
codegen-units = 1
