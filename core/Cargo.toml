[package]
name = "guard_core"
version = "2.1.0"
edition = "2021"
description = "Guard's scan engine core: rule matching, content heuristics, YARA and file-change events"
license = "MIT"
publish = false

[lib]
name = "guard_core"

[dependencies]
memchr = "2.8.3"
# Native file-change events for the watcher (inotify / FSEvents / ReadDirectoryChangesW).
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }
regex = "1.13.1"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
# YARA rules. Modules community rule sets rely on; skips vt/cuckoo (need external
# reports), magic (needs libmagic) and the test modules.
yara-x = { version = "1.21.0", default-features = false, features = [
    "constant-folding", "exact-atoms", "fast-regexp",
    "console-module", "dex-module", "dotnet-module", "elf-module", "hash-module",
    "lnk-module", "macho-module", "math-module", "pe-module", "string-module",
    "time-module",
] }

[profile.release]
lto = true
codegen-units = 1
