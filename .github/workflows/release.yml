# Guard release pipeline: one `git tag vX.Y.Z` -> build all OS binaries, sign the
# OTA manifest, and publish a GitHub Release with everything the updater needs.
#
# Required repo config (Settings -> Secrets and variables -> Actions):
#   Secrets:  GUARD_UPDATE_PUBKEY = your Ed25519 PUBLIC key (hex)   [baked into binaries]
#             GUARD_UPDATE_URL    = https://github.com/<org>/<repo>/releases/latest/download
#             GUARD_SIGN_KEY_B64  = base64 of the 32-byte SECRET seed   [signs the manifest]

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version: { description: "version e.g. 1.1.0", required: true }
  # Dry run: build and smoke-test every platform binary on PRs that touch the
  # native core, the Rust binary or the packaging, without baking secrets or
  # publishing anything.
  pull_request:
    paths:
      - "core/**"
      - "cli/**"
      - "build/**"
      - ".github/workflows/release.yml"

permissions:
  contents: write        # create the Release

jobs:
  test:
    # never publish a build the test suite / coverage gate rejects
    uses: ./.github/workflows/tests.yml

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    plat: linux-x64 }     # Linux x86_64
          - { os: ubuntu-24.04-arm, plat: linux-arm64 }   # Linux ARM64
          - { os: macos-14,         plat: darwin-arm64 }  # macOS Apple Silicon
          # macos-13 (Intel) removed: GitHub Intel-Mac runners can queue 24h and time out.
          # Add back later if Intel-Mac support is needed and runners are available.
          - { os: windows-latest,   plat: windows-x64 }   # Windows x86_64
          - { os: windows-11-arm,   plat: windows-arm64 } # Windows on ARM
    runs-on: ${{ matrix.os }}
    env:
      # Dormant Windows code signing: turns on automatically once the SignPath
      # Foundation secrets exist (see docs/WINDOWS-CODE-SIGNING.md). Until then,
      # builds publish unsigned + SHA-256, exactly as before.
      SIGNPATH_ENABLED: ${{ github.event_name != 'pull_request' && secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Resolve version
        id: v
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then V="0.0.0-pr${{ github.event.number }}"
          else V="${GITHUB_REF_NAME#v}"; fi
          echo "version=${V#v}" >> "$GITHUB_OUTPUT"

      - name: Bake release identity into the binary
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          PUBKEY: ${{ secrets.GUARD_UPDATE_PUBKEY }}
          UPURL: ${{ secrets.GUARD_UPDATE_URL }}
          TELURL: ${{ secrets.GUARD_TELEMETRY_URL }}
          INGEST: ${{ secrets.GUARD_INGEST_TOKEN }}
          VER: ${{ steps.v.outputs.version }}
        run: |
          python - <<'PY'
          import os, re, pathlib
          pub, url, ver = os.environ["PUBKEY"], os.environ["UPURL"], os.environ["VER"]
          telurl, ingest = os.environ.get("TELURL", ""), os.environ.get("INGEST", "")
          up = pathlib.Path("updater.py"); s = up.read_text()
          s = re.sub(r'PUBKEY_HEX = os\.environ\.get\("GUARD_UPDATE_PUBKEY", "[^"]*"\)',
                     f'PUBKEY_HEX = os.environ.get("GUARD_UPDATE_PUBKEY", "{pub}")', s)
          s = re.sub(r'BASE_URL = os\.environ\.get\("GUARD_UPDATE_URL", "[^"]*"\)',
                     f'BASE_URL = os.environ.get("GUARD_UPDATE_URL", "{url}")', s)
          s = re.sub(r'CURRENT_VERSION = "[^"]*"', f'CURRENT_VERSION = "{ver}"', s)
          up.write_text(s)
          g = pathlib.Path("guard.py"); t = g.read_text()
          t = re.sub(r'VERSION = "[^"]*"', f'VERSION = "{ver}"', t)
          tel = pathlib.Path("telemetry.py"); tp = tel.read_text()
          # Only OVERRIDE the telemetry endpoint/token when the CI secret is set;
          # otherwise keep the working default hardcoded in source (don't blank it).
          if telurl:
              t = re.sub(r'TELEMETRY_URL = os\.environ\.get\("GUARD_TELEMETRY_URL", "[^"]*"\)',
                         f'TELEMETRY_URL = os.environ.get("GUARD_TELEMETRY_URL", "{telurl}")', t)
              tp = re.sub(r'DEFAULT_ENDPOINT = os\.environ\.get\("GUARD_TELEMETRY_URL", "[^"]*"\)',
                          f'DEFAULT_ENDPOINT = os.environ.get("GUARD_TELEMETRY_URL", "{telurl}")', tp)
          if ingest:
              t = re.sub(r'INGEST_TOKEN = os\.environ\.get\("GUARD_INGEST_TOKEN", "[^"]*"\)',
                         f'INGEST_TOKEN = os.environ.get("GUARD_INGEST_TOKEN", "{ingest}")', t)
              tp = re.sub(r'DEFAULT_INGEST = os\.environ\.get\("GUARD_INGEST_TOKEN", "[^"]*"\)',
                          f'DEFAULT_INGEST = os.environ.get("GUARD_INGEST_TOKEN", "{ingest}")', tp)
          g.write_text(t)
          tel.write_text(tp)
          print("baked telemetry:", telurl or "(source default)")
          print("baked", ver, url, pub[:12] + "...")
          PY

      - uses: dtolnay/rust-toolchain@stable

      - name: Build single binary
        shell: bash
        env: { GUARD_REQUIRE_NATIVE: "1" }
        run: |
          python -m pip install --quiet --upgrade pip pyinstaller certifi
          python -m pip install --quiet ./core
          pyinstaller build/guard.spec --distpath build/dist --workpath build/work --clean --noconfirm

      # The frozen binary must load guard_core and run YARA rules, not just build.
      - name: Smoke-test binary (Rust core + YARA)
        shell: bash
        run: |
          case "${{ matrix.plat }}" in windows-*) g=build/dist/guard.exe ;; *) g=build/dist/guard ;; esac
          mkdir -p smoke/sigs
          printf 'rule smoke_test { meta: verdict = "malicious" strings: $a = "GUARD-RELEASE-SMOKE" condition: $a }\n' > smoke/sigs/smoke.yar
          printf 'xx GUARD-RELEASE-SMOKE xx\n' > smoke/hit.txt
          "$g" version
          "$g" av rules --validate smoke/sigs/smoke.yar
          set +e; out=$("$g" av scan --signatures smoke/sigs smoke/hit.txt); rc=$?; set -e
          echo "$out"
          [ "$rc" = 1 ] && echo "$out" | grep -q 'yara: smoke_test' || { echo "YARA smoke scan did not detect the test file"; exit 1; }

      # The Rust port of guard (cli/), one static binary per platform. Built and
      # tested next to the PyInstaller binary on every run; not published until
      # it replaces it (PR dry runs upload it for trying out).
      - name: Build static Rust guard
        id: rs
        # gates PR dry runs; never blocks a real release of the Python build
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        shell: bash
        env:
          GUARD_VERSION: ${{ steps.v.outputs.version }}
          PUBKEY: ${{ secrets.GUARD_UPDATE_PUBKEY }}
          UPURL: ${{ secrets.GUARD_UPDATE_URL }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # same release identity the Python build gets baked in above
            export GUARD_UPDATE_PUBKEY="$PUBKEY" GUARD_UPDATE_URL="$UPURL"
          fi
          case "${{ matrix.plat }}" in
            linux-x64)     t=x86_64-unknown-linux-musl ;;
            linux-arm64)   t=aarch64-unknown-linux-musl ;;
            darwin-arm64)  t=aarch64-apple-darwin ;;
            windows-x64)   t=x86_64-pc-windows-msvc ;;
            windows-arm64) t=aarch64-pc-windows-msvc ;;
          esac
          case "$t" in
            *-linux-musl)
              sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
              export CC_${t//-/_}=musl-gcc ;;
            *-windows-msvc)
              export RUSTFLAGS="-C target-feature=+crt-static" ;;   # no VC++ runtime needed
          esac
          rustup target add "$t"
          cargo build --release --locked --manifest-path cli/Cargo.toml --target "$t"
          exe=""; case "$t" in *windows*) exe=.exe ;; esac
          echo "bin=cli/target/$t/release/guard$exe" >> "$GITHUB_OUTPUT"

      # Self-contained, and its signed self-update matches updater.py on this OS
      # (including the rename swap on Windows).
      - name: Test Rust guard (static + OTA parity)
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        shell: bash
        env:
          GUARD_RS_BIN: ${{ steps.rs.outputs.bin }}
          GUARD_VERSION: ${{ steps.v.outputs.version }}
        run: |
          b="$GUARD_RS_BIN"; ls -l "$b"
          case "${{ matrix.plat }}" in
            linux-*)  file "$b"; file "$b" | grep -Eq 'statically linked|static-pie linked' ;;
            darwin-*) otool -L "$b"
                      if otool -L "$b" | tail -n +2 | grep -Ev '^\s*/(usr/lib|System/Library)/'; then
                        echo "links a non-system library"; exit 1
                      fi ;;
          esac
          "$b" version
          python -m pip install --quiet -r requirements-dev.txt
          python -m pytest tests/test_rust_binary.py --no-cov -p no:cacheprovider -q

      - name: Upload Rust guard (dry run only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: rust-guard-${{ matrix.plat }}
          path: ${{ steps.rs.outputs.bin }}

      - name: Name artifact
        id: name
        shell: bash
        run: |
          mkdir -p out
          case "${{ matrix.plat }}" in
            windows-*) cp build/dist/guard.exe "out/guard-${{ matrix.plat }}.exe"; f="out/guard-${{ matrix.plat }}.exe" ;;
            *)         cp build/dist/guard     "out/guard-${{ matrix.plat }}";     f="out/guard-${{ matrix.plat }}" ;;
          esac
          echo "file=$f" >> "$GITHUB_OUTPUT"

      # ---- Windows Authenticode signing via SignPath Foundation ----
      # Dormant until the SIGNPATH_* secrets exist. The signed binary REPLACES the
      # unsigned one BEFORE the checksum below, so both the .sha256 sidecar and the
      # OTA manifest (built from these artifacts) cover the signed bytes.
      - name: Upload unsigned binary (for signing)
        id: unsigned
        if: startsWith(matrix.plat, 'windows') && env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.plat }}
          path: ${{ steps.name.outputs.file }}

      - name: Sign with SignPath Foundation
        if: startsWith(matrix.plat, 'windows') && env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Swap in signed binary
        if: startsWith(matrix.plat, 'windows') && env.SIGNPATH_ENABLED == 'true'
        shell: bash
        run: cp "signed/$(basename '${{ steps.name.outputs.file }}')" "${{ steps.name.outputs.file }}"

      - name: Checksum artifact
        shell: bash
        run: |
          f="${{ steps.name.outputs.file }}"
          ( command -v sha256sum >/dev/null && sha256sum "$f" || shasum -a 256 "$f" ) | awk '{print $1}' > "$f.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: guard-${{ matrix.plat }}
          path: out/*

  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Resolve version
        id: v
        # tag push: v1.2.3 -> 1.2.3; manual run: the "version" input (the release
        # step below then creates the v<version> tag on the commit being built)
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}"; else V="${GITHUB_REF_NAME#v}"; fi
          echo "version=${V#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }

      - name: Stage malware blocklist (committed snapshot)
        run: |
          # Ship the committed blocklist snapshot — fast. Agents refresh it themselves
          # via OTA `guard deps update`, so the release doesn't do a slow full fetch.
          cp malware-feed/malware-blocklist.json artifacts/malware-blocklist.json
          echo "blocklist names: $(python3 -c 'import json;print(sum(len(v) for v in json.load(open("malware-feed/malware-blocklist.json")).values()))')"

      - name: Restore signing key
        env:
          KEY_B64: ${{ secrets.GUARD_SIGN_KEY_B64 }}
        run: echo "$KEY_B64" | base64 -d > /tmp/guard-update.key && chmod 600 /tmp/guard-update.key

      - name: Build + sign manifest
        run: |
          BINS=""
          # auto-include every built binary (guard-<plat>[.exe]); skip .sha256
          for f in artifacts/guard-*; do
            case "$f" in *.sha256) continue ;; esac
            base=$(basename "$f"); plat=${base#guard-}; plat=${plat%.exe}
            BINS="$BINS --binary $plat=$f"
          done
          echo "signing binaries:$BINS"
          python3 release/sign_manifest.py build-and-sign \
            --version "${{ steps.v.outputs.version }}" \
            --key /tmp/guard-update.key \
            --base-url "${{ secrets.GUARD_UPDATE_URL }}" \
            --blocklist artifacts/malware-blocklist.json \
            $BINS --out artifacts/manifest.json
          rm -f /tmp/guard-update.key

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/guard-*
            artifacts/manifest.json
            artifacts/manifest.json.sig
            artifacts/malware-blocklist.json
