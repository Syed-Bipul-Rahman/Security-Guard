# Rust tests and the guard binary's integration tests on every push / PR.
# (detection.rs also scans this repository and the binary itself for false
# positives.)
name: tests

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Engine core unit tests
        run: cargo test --locked --manifest-path core/Cargo.toml
      - name: Release signer tests
        run: cargo test --locked --manifest-path release/Cargo.toml
      # unit tests, then integration tests against goldens recorded from the
      # Python build the binary replaced (cli/tests/common/mod.rs)
      - name: guard binary tests
        run: cargo test --locked --manifest-path cli/Cargo.toml
      - name: Full false-positive sweep (system binaries + Python stdlib if present)
        if: matrix.os == 'ubuntu-latest'
        env: { GUARD_FP_FULL: "1" }
        run: cargo test --locked --manifest-path cli/Cargo.toml --test detection zero_false_positives
