# Test suite + 100% coverage gate + zero-false-positive sweep on every push / PR.
name: tests

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: macos-14,      python: "3.12" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust unit tests
        run: |
          cargo test --manifest-path core/Cargo.toml
          cargo test --locked --manifest-path cli/Cargo.toml
          cargo test --locked --manifest-path release/Cargo.toml
      # tests/test_rust_*.py run them against the Python code they replace
      - name: Build the Rust guard binary and the release signer
        run: |
          cargo build --locked --manifest-path cli/Cargo.toml
          cargo build --locked --manifest-path release/Cargo.toml
      - name: Install test deps + Rust core
        run: |
          python -m pip install --quiet -r requirements-dev.txt
          python -m pip install --quiet ./core
      # the binary's tests compare it with goldens recorded from guard.py
      # (Python 3.12, as the PyInstaller releases were built)
      - name: Rust goldens still match the Python build
        if: matrix.python == '3.12'
        shell: bash
        run: cli/tests/check-against-python.sh
      - name: Unit + integration + accuracy tests (100% coverage gate)
        run: python -m pytest --cov --cov-report=term-missing
      - name: Full false-positive sweep (stdlib + system binaries)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        env: { GUARD_FP_FULL: "1" }
        run: python -m pytest tests/test_detection_accuracy.py -k false_positives -p no:cacheprovider --no-cov
      - name: Guard scans its own source clean
        run: python -m guard_av scan . --fail-on-suspicious
